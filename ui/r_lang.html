<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RStudio</title>
<style>
  :root {
    /* VS Code Dark Modern palette */
    --bg:           #1f1f1f;   /* editor.background */
    --surface:      #181818;   /* sideBar / titleBar */
    --surface2:     #2a2d2e;   /* list.hoverBackground */
    --border:       #2b2b2b;   /* editorGroup.border */
    --border2:      #2b2b2b;
    --accent:       #0078d4;   /* focusBorder / button.background */
    --accent-hover: #026ec1;
    --selection:    #04395e;   /* list.activeSelectionBackground */
    --text:         #cccccc;   /* editor.foreground */
    --text2:        #9d9d9d;   /* descriptionForeground */
    --text3:        #6e7681;   /* disabledForeground */
    --input-bg:     #313131;
    --user-bg:      #252526;   /* editorWidget.background */
    --ai-bg:        #1f1f1f;
    --code-bg:      #1e1e1e;   /* integrated editor / terminal */
    --red:          #f48771;   /* errorForeground */
    --green:        #89d185;   /* debugIcon.startForeground */
    --yellow:       #cca700;   /* editorWarning.foreground */
    --radius:       2px;       /* VS Code barely rounds anything */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* VS Code scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(121,121,121,0.4); }
  ::-webkit-scrollbar-thumb:hover { background: rgba(100,100,100,0.7); }
  ::-webkit-scrollbar-corner { background: transparent; }

  /* VS Code focus ring */
  :focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }

  .icon { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; display: block; }
  .icon-sm { width: 14px; height: 14px; }

  /* Title bar (VS Code) */
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 10px;
    height: 35px;
  }

  #topbar .logo {
    font-weight: 400;
    font-size: 12px;
    color: var(--text2);
    letter-spacing: 0;
  }
  #topbar .logo span { color: var(--text3); font-weight: 400; margin-left: 6px; }

  .status-group { display: flex; align-items: center; gap: 6px; margin-left: 12px; padding-left: 12px; border-left: 1px solid var(--border); height: 18px; }
  #status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--red);
    flex-shrink: 0;
    transition: background 0.2s;
  }
  #status-dot.ok { background: var(--green); }
  #status-dot.checking { background: var(--yellow); }
  #status-label { font-size: 11.5px; color: var(--text2); }

  .topbar-left { display: flex; align-items: center; }
  .topbar-right { display: flex; align-items: center; gap: 0; }

  .icon-btn {
    background: none;
    border: none;
    color: var(--text2);
    border-radius: var(--radius);
    width: 28px; height: 28px;
    padding: 0;
    cursor: pointer;
    transition: color 0.1s, background 0.1s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { color: var(--text); background: var(--surface2); }
  .icon-btn:active { background: rgba(255,255,255,0.08); }
  .icon-btn.danger:hover { color: var(--red); }

  /* History panel */
  #history-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 100; display: none;
  }
  #history-overlay.open { display: block; }

  #history-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 300px;
    background: var(--surface); border-left: 1px solid var(--border);
    z-index: 101; display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform 0.15s ease;
  }
  #history-panel.open { transform: translateX(0); }

  #history-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 8px 4px 20px; flex-shrink: 0; height: 35px;
  }
  #history-header h3 {
    font-size: 11px; font-weight: 400;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--text2);
  }

  #history-list { flex: 1; overflow-y: auto; padding: 4px 0; }

  .session-item {
    padding: 4px 20px; cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.08s; position: relative;
    font-size: 13px; line-height: 1.45;
  }
  .session-item:hover { background: var(--surface2); }
  .session-item.active { background: var(--selection); }

  .session-title {
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-right: 24px;
  }
  .session-meta { font-size: 11px; color: var(--text3); }

  .session-del {
    position: absolute; top: 4px; right: 8px;
    background: none; border: none; color: var(--text2);
    cursor: pointer; padding: 4px; border-radius: var(--radius);
    opacity: 0; transition: opacity 0.1s, background 0.1s;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .session-item:hover .session-del { opacity: 1; }
  .session-del:hover { background: var(--surface2); color: var(--text); }

  #history-empty {
    text-align: center; color: var(--text3); font-size: 12.5px;
    padding: 40px 20px; line-height: 1.7;
  }

  /* Settings panel (looks like VS Code settings editor strip) */
  #settings-panel {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: none;
    flex-shrink: 0;
    gap: 14px;
    flex-wrap: wrap;
  }
  #settings-panel.open { display: flex; }

  .setting-group { display: flex; flex-direction: column; gap: 4px; min-width: 160px; }
  .setting-group label {
    font-size: 11px; color: var(--text2);
    font-weight: 400;
  }
  .setting-group input, .setting-group select, .setting-group textarea {
    background: var(--input-bg); border: 1px solid transparent;
    color: var(--text); border-radius: var(--radius); padding: 4px 8px;
    font-size: 12.5px; font-family: inherit;
    line-height: 1.4;
  }
  .setting-group input:focus, .setting-group select:focus, .setting-group textarea:focus {
    outline: none; border-color: var(--accent);
  }

  .setting-group.wide { flex: 1; min-width: 280px; }
  .setting-group textarea {
    resize: vertical; min-height: 60px; max-height: 140px;
    font-size: 12px; line-height: 1.5;
    font-family: inherit;
  }

  /* Chat area */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Drop overlay */
  #drop-overlay {
    position: fixed; inset: 12px;
    background: rgba(0, 120, 212, 0.04);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    font-size: 13px;
    color: var(--text2);
    pointer-events: none;
  }
  #drop-overlay.active { display: flex; border-color: var(--accent); color: var(--text); background: rgba(0, 120, 212, 0.08); }

  /* Messages */
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 860px;
    width: 100%;
  }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.ai   { align-self: flex-start; align-items: flex-start; }

  .msg-label {
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 4px;
    padding: 0 2px;
    font-weight: 400;
  }

  .msg-body {
    padding: 10px 14px;
    border-radius: var(--radius);
    line-height: 1.55;
    word-break: break-word;
    position: relative;
    font-size: 13px;
  }
  .msg.user .msg-body {
    background: var(--user-bg);
    border: 1px solid var(--border);
  }
  .msg.ai .msg-body {
    background: transparent;
    border: 1px solid var(--border);
  }

  .msg-actions {
    display: flex;
    gap: 4px;
    margin-top: 4px;
    padding: 0 2px;
  }

  .copy-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text2); border-radius: var(--radius);
    padding: 2px 9px; font-size: 11px; cursor: pointer;
    font-family: inherit;
    transition: background 0.1s, color 0.1s, border-color 0.1s;
  }
  .copy-btn:hover { color: var(--text); background: var(--surface2); border-color: var(--text3); }
  .copy-btn.copied { color: var(--green); border-color: var(--green); }

  /* Thinking block (VS Code peek view style) */
  .think-block {
    width: 100%;
    max-width: 860px;
    margin-bottom: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .think-block summary {
    cursor: pointer;
    padding: 5px 10px;
    font-size: 11px;
    color: var(--text2);
    user-select: none;
    display: flex;
    align-items: center;
    gap: 6px;
    list-style: none;
    background: var(--surface);
  }
  .think-block summary::-webkit-details-marker { display: none; }
  .think-block summary::before {
    content: "";
    width: 0; height: 0;
    border-left: 4px solid var(--text2);
    border-top: 3px solid transparent;
    border-bottom: 3px solid transparent;
    transition: transform 0.1s;
    margin-right: 2px;
  }
  .think-block[open] summary::before { transform: rotate(90deg); }
  .think-block summary:hover { color: var(--text); background: var(--surface2); }
  .think-block .think-body {
    padding: 8px 12px 10px 22px;
    font-size: 12px;
    color: var(--text2);
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    border-top: 1px solid var(--border);
    max-height: 360px;
    overflow-y: auto;
    background: var(--bg);
  }
  .think-block.streaming summary::after {
    content: "thinking…";
    margin-left: auto;
    color: var(--text3);
    font-size: 11px;
  }

  /* Markdown in AI messages */
  .msg.ai .msg-body p { margin: 0 0 8px; }
  .msg.ai .msg-body p:last-child { margin-bottom: 0; }
  .msg.ai .msg-body strong { color: #ffffff; font-weight: 600; }
  .msg.ai .msg-body em { color: var(--text2); }

  .msg.ai .msg-body ul, .msg.ai .msg-body ol {
    padding-left: 22px; margin: 6px 0;
  }
  .msg.ai .msg-body li { margin: 3px 0; }

  .msg.ai .msg-body h1, .msg.ai .msg-body h2, .msg.ai .msg-body h3 {
    color: #ffffff; margin: 10px 0 4px; font-weight: 600;
  }
  .msg.ai .msg-body h1 { font-size: 15px; }
  .msg.ai .msg-body h2 { font-size: 14px; }
  .msg.ai .msg-body h3 { font-size: 13px; }

  .msg.ai .msg-body code:not(.block-code) {
    background: rgba(255,255,255,0.06);
    color: #d4d4d4;
    padding: 1px 4px;
    border-radius: var(--radius);
    font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    font-size: 12px;
  }

  /* VS Code-style code block */
  .code-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin: 10px 0;
    overflow: hidden;
  }

  .code-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 10px 4px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    height: 28px;
  }

  .code-lang {
    font-size: 11px;
    color: var(--text2);
    font-family: inherit;
  }

  .code-copy {
    background: transparent; border: 1px solid transparent;
    color: var(--text2); font-size: 11px; cursor: pointer;
    padding: 2px 8px; border-radius: var(--radius);
    font-family: inherit;
    transition: color 0.1s, background 0.1s;
  }
  .code-copy:hover { color: var(--text); background: var(--surface2); }
  .code-copy.copied { color: var(--green); }

  .code-block pre {
    margin: 0;
    padding: 10px 14px;
    overflow-x: auto;
    font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.5;
    color: #d4d4d4;
  }

  /* VS Code Dark+ syntax palette */
  .kw { color: #569cd6; }               /* keywords */
  .bi { color: #dcdcaa; }               /* builtins / functions */
  .fn { color: #dcdcaa; }
  .st { color: #ce9178; }               /* strings */
  .co { color: #6a9955; font-style: normal; }  /* comments */
  .nu { color: #b5cea8; }               /* numbers */
  .de { color: #c586c0; }               /* decorators */

  /* Thinking indicator */
  .thinking {
    display: flex; gap: 4px; padding: 5px 2px; align-items: center;
  }
  .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* File chips */
  #attached-files {
    display: flex; flex-wrap: wrap; gap: 5px;
    padding: 0 20px 8px;
    flex-shrink: 0;
  }

  .file-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--input-bg); border: 1px solid transparent;
    border-radius: var(--radius); padding: 3px 8px;
    font-size: 12px; color: var(--text2);
  }
  .file-chip .chip-name { color: var(--text); }
  .file-chip .remove {
    cursor: pointer; color: var(--text2);
    display: inline-flex; align-items: center;
    padding: 0 2px; margin-left: 2px;
    transition: color 0.1s;
  }
  .file-chip .remove:hover { color: var(--red); }

  /* Input area (VS Code terminal-like strip) */
  #input-area {
    padding: 10px 20px 14px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  #input-row {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    background: var(--input-bg);
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 4px 4px 4px 6px;
    transition: border-color 0.1s;
  }
  #input-row:focus-within { border-color: var(--accent); }

  #attach-btn {
    background: transparent; border: none;
    color: var(--text2); cursor: pointer;
    padding: 5px; border-radius: var(--radius);
    line-height: 1;
    transition: color 0.1s, background 0.1s;
    flex-shrink: 0;
    align-self: flex-end;
    margin-bottom: 1px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  #attach-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }

  #file-input { display: none; }

  #msg-input {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 22px;
    max-height: 180px;
    line-height: 1.55;
    padding: 4px 4px;
    overflow-y: auto;
  }
  #msg-input::placeholder { color: var(--text3); }

  /* VS Code primary button */
  #send-btn {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #ffffff;
    border-radius: var(--radius);
    padding: 4px 14px;
    font-size: 13px; font-weight: 400;
    font-family: inherit;
    cursor: pointer; transition: background 0.1s, border-color 0.1s;
    flex-shrink: 0; align-self: flex-end;
    height: 26px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  #send-btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  #send-btn:disabled { background: var(--input-bg); border-color: var(--input-bg); color: var(--text3); cursor: not-allowed; }

  #input-hint {
    font-size: 11px; color: var(--text3);
    margin-top: 6px; padding: 0 2px;
  }
  #input-hint #hint-model { color: var(--text2); font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 11px; }

  /* Welcome screen */
  #welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 10px;
    color: var(--text3);
    padding: 40px;
    text-align: center;
  }
  #welcome h2 {
    color: var(--text);
    font-size: 22px;
    font-weight: 300;
    letter-spacing: -0.2px;
  }
  #welcome p {
    max-width: 440px;
    line-height: 1.6;
    color: var(--text2);
    font-size: 13px;
  }
  #welcome .shortcuts {
    margin-top: 18px;
    font-size: 12px;
    color: var(--text3);
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #welcome .shortcuts kbd {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: var(--radius);
    padding: 1px 6px;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 10.5px;
    color: var(--text);
    margin: 0 2px;
  }
</style>
</head>
<body>

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="icon-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <polyline points="12 7 12 12 15 14"/>
    </symbol>
    <symbol id="icon-sliders" viewBox="0 0 24 24">
      <line x1="21" x2="14" y1="4" y2="4"/>
      <line x1="10" x2="3" y1="4" y2="4"/>
      <line x1="21" x2="12" y1="12" y2="12"/>
      <line x1="8" x2="3" y1="12" y2="12"/>
      <line x1="21" x2="16" y1="20" y2="20"/>
      <line x1="12" x2="3" y1="20" y2="20"/>
      <line x1="14" x2="14" y1="2" y2="6"/>
      <line x1="8" x2="8" y1="10" y2="14"/>
      <line x1="16" x2="16" y1="18" y2="22"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </symbol>
    <symbol id="icon-x" viewBox="0 0 24 24">
      <line x1="6" y1="6" x2="18" y2="18"/>
      <line x1="18" y1="6" x2="6" y2="18"/>
    </symbol>
    <symbol id="icon-paperclip" viewBox="0 0 24 24">
      <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 17.93 8.8l-8.57 8.57a2 2 0 0 1-2.83-2.83l7.87-7.87"/>
    </symbol>
    <symbol id="icon-file" viewBox="0 0 24 24">
      <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
      <polyline points="14 3 14 9 20 9"/>
    </symbol>
    <symbol id="icon-send" viewBox="0 0 24 24">
      <line x1="12" y1="19" x2="12" y2="5"/>
      <polyline points="5 12 12 5 19 12"/>
    </symbol>
  </defs>
</svg>

<!-- History overlay + panel -->
<div id="history-overlay" onclick="closeHistory()"></div>
<div id="history-panel">
  <div id="history-header">
    <h3>History</h3>
    <button id="history-close" class="icon-btn" onclick="closeHistory()" title="Close">
      <svg class="icon"><use href="#icon-x"/></svg>
    </button>
  </div>
  <div id="history-list"></div>
</div>

<!-- Drop overlay -->
<div id="drop-overlay">Drop files to attach</div>

<!-- Top bar -->
<div id="topbar">
  <div class="topbar-left">
    <div class="logo">RStudio</div>
    <div class="status-group">
      <div id="status-dot" class="checking"></div>
      <span id="status-label">Connecting</span>
    </div>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" onclick="openHistory()" title="History">
      <svg class="icon"><use href="#icon-clock"/></svg>
    </button>
    <button class="icon-btn" onclick="toggleSettings()" title="Settings">
      <svg class="icon"><use href="#icon-sliders"/></svg>
    </button>
    <button class="icon-btn" onclick="newChat()" title="New chat">
      <svg class="icon"><use href="#icon-plus"/></svg>
    </button>
  </div>
</div>

<!-- Settings panel -->
<div id="settings-panel">
  <div class="setting-group">
    <label>API Port</label>
    <input type="number" id="cfg-port" value="11434" min="1024" max="65535">
  </div>
  <div class="setting-group">
    <label>Temperature</label>
    <input type="number" id="cfg-temp" value="0.3" min="0" max="2" step="0.1">
  </div>
  <div class="setting-group">
    <label>Max Tokens</label>
    <input type="number" id="cfg-maxtokens" value="4096" min="64" max="8192" step="64">
  </div>
  <div class="setting-group wide">
    <label>System Prompt</label>
    <textarea id="cfg-sysprompt">You are an R programming tutor for UIU course DS 3522 (Data Visualization Lab). You answer class-test and assignment questions with runnable R code. Libraries available: base R, tidyverse (dplyr, tidyr, readr, ggplot2), lubridate.

=== R HARD RULES (these are the most common small-model mistakes — never violate them) ===
- R is 1-INDEXED. The first element is v[1], not v[0]. Loops over indices use 1:length(v) or seq_along(v), never 0:n.
- Assignment is &lt;- not = inside code blocks (e.g. x &lt;- 5, df &lt;- data.frame(...)). = is allowed only inside function-call arguments (e.g. mean(x, na.rm = TRUE)).
- ALWAYS pass na.rm = TRUE to mean(), median(), sd(), var(), min(), max(), sum(), quantile() — unless the question explicitly says "do not skip NAs". NA propagates silently otherwise.
- Native pipe is |&gt; (R 4.1+). Magrittr %&gt;% is acceptable when reading tidyverse code. Prefer |&gt; in new code. Inside |&gt; chains, the LHS becomes the first argument of the RHS.
- R is VECTORISED. Default to vectorised ops (ifelse, case_when, x * 2, x &gt; 5) instead of for-loops. Only loop when the question explicitly says "for loop" or when the operation has side effects.
- Logical operators: &amp; and | are element-wise (use these inside ifelse, filter, subset). &amp;&amp; and || are scalar short-circuit (use these in if() conditions). Never use &amp;&amp; on a vector.
- For TRUE/FALSE always write TRUE/FALSE in full. T and F are mutable in R and a graded answer should never rely on them.
- Stats: var() and sd() in R already use Bessel's correction (sample variance, n-1 denominator). There is no ddof argument. Do NOT manually divide by (n-1) on top of var() — that double-corrects.
- print() inside scripts is sometimes required to display output from a function or a loop body. At the top level the REPL auto-prints, but inside for() and inside source()'d files it does not.

=== R BASIC RECIPES (Sections 1–14 of the syllabus) ===

Vectors:
- Create:        x &lt;- c(25, 30, 35, 40, 45)
- Sequences:     1:10  ;  seq(0, 1, by = 0.1)  ;  seq(1, 100, length.out = 5)
- Repeats:       rep(c(0, 1), times = 4)  ;  rep("hi", 3)
- Stats:         mean(x, na.rm = TRUE), median(x, na.rm = TRUE), sd(x, na.rm = TRUE),
                 var(x, na.rm = TRUE), min(x, na.rm = TRUE), max(x, na.rm = TRUE),
                 quantile(x, probs = c(0.25, 0.5, 0.75), na.rm = TRUE)
- Indexing:      v[1] (first), v[c(1,3,5)] (multi), v[-2] (drop 2nd), v[2:4] (range),
                 v[v &gt; 20] (logical)
- The recycling rule: shorter vectors are recycled to match length; warns if not a multiple.

Data frames:
- Create:        df &lt;- data.frame(name = c("A","B","C"), age = c(20, 22, 25), passed = c(TRUE, TRUE, FALSE))
- Inspect:       head(df), tail(df), str(df), summary(df), nrow(df), ncol(df)
- Column:        df$age   OR   df[["age"]]
- Row:           df[1, ]   ;   df[df$age &gt; 21, ]   (NOTE the trailing comma — keeps all columns)
- Subset:        subset(df, age &gt; 21)
- Add column:    df$grade &lt;- ifelse(df$mark &gt;= 80, "A", "B")

Lists:
- Create:        person &lt;- list(name = "Alice", age = 30, scores = c(85, 92, 78))
- By name:       person$name   OR   person[["name"]]
- By position:   person[[2]]   (double bracket returns the element, single bracket returns a sublist)

Factors:
- Create:        sizes &lt;- factor(c("S","M","L","M","S"), levels = c("S","M","L"), ordered = TRUE)
- ALWAYS pass levels = ... when level order matters for plotting / comparison.
- Comparison (sizes &lt; "L") only works on ordered factors.

Matrices:
- Create:        m &lt;- matrix(1:12, nrow = 3, ncol = 4)
- Element:       m[2, 3]
- Multiply:      m %*% t(m)
- Inverse:       solve(m %*% t(m))

apply family (preferred over manual loops):
- apply(m, 1, sum)   row sums of a matrix
- apply(m, 2, mean)  column means of a matrix
- sapply(list, fun)  returns simplified vector
- lapply(list, fun)  returns list

Functions:
- f &lt;- function(x, scale = 1) { x * scale }   # default arg via =
- Anonymous (R 4.1+): \(x) x^2
- Last expression is returned automatically; return() is optional.

=== EXAM IMPORT DISCIPLINE — critical rule, read first ===
The DS 3522 final exam paper lists ONLY `library(ggplot2)` in its allowed

list — including `dplyr`, `lubridate`, `tidyr`, `readr`. Default behaviour:

- For data wrangling, use BASE R, not dplyr:

- For dates, use BASE R, not lubridate:
    base R date:         as.Date("1973-07-01")

- ggplot2 itself is always allowed; that is the one library the paper lists.

dplyr / lubridate are ONLY acceptable when the question text uses the word

=== BUILT-IN R DATASETS (every DV Lab question uses one of these — get the columns right) ===
Getting a column name wrong is the most common source of runtime errors.
Memorise the exact spelling and what each column means.

- `iris` — 150 rows. Columns: `Sepal.Length`, `Sepal.Width`, `Petal.Length`,
  `Petal.Width`, `Species` (factor: setosa, versicolor, virginica). No date
  column. Note the dots in the names, not underscores.
- `mtcars` — 32 rows. Columns: `mpg`, `cyl`, `disp`, `hp`, `drat`, `wt`,
  `qsec`, `vs`, `am`, `gear`, `carb`. Row names are car models (e.g.
  "Mazda RX4"). `cyl` takes values 4, 6, 8.
- `airquality` — daily NYC air-quality readings, May–Sep 1973. Columns:
  `Ozone`, `Solar.R`, `Wind`, `Temp` (°F), `Month` (integer 5–9),
  `Day` (integer 1–31, DAY-OF-MONTH not day-of-year). 153 rows.
  To pick one month: `airquality |> filter(Month == 7)` or
  `airquality[airquality$Month == 7, ]`. Then plot `Day` (1–31) on the
  x-axis directly — do NOT convert Day to a real Date via lubridate's
  `days()`; Day is already the integer x-axis value the question wants.
- `cars` — 50 rows. Columns: `speed`, `dist`. Stopping-distance dataset.
- `ToothGrowth` — 60 rows. Columns: `len`, `supp` (factor: OJ, VC), `dose`.
- `PlantGrowth` — 30 rows. Columns: `weight`, `group` (factor: ctrl, trt1, trt2).

If the question says "use the built-in X dataset", do NOT generate synthetic
data with rnorm/runif. Use X directly. Synthetic data is only correct when
the question explicitly describes a table the student must invent.

=== ggplot2 RECIPES (the highest-yield section — exam questions live here) ===

Every ggplot answer MUST start with library(ggplot2). dplyr / tidyr only when needed.

Skeleton:
  ggplot(data, aes(x = ..., y = ..., color = ...)) +
    geom_xxx(...) +
    labs(title = "...", x = "...", y = "...") +
    theme_minimal()

Line chart (e.g. daily temperature for one month):
  ggplot(df, aes(x = date, y = temp)) +
    geom_line(color = "steelblue", linewidth = 0.8) +
    geom_point(size = 2) +
    labs(title = "Daily temperature", x = "Date", y = "Temperature (°C)") +
    theme_minimal()
  If the x-axis is date-like, scale_x_date(date_labels = "%b %d") gives clean tick labels.

Grouped scatter + per-group linear trend (iris-style):
  ggplot(iris, aes(x = Petal.Width, y = Petal.Length, color = Species)) +
    geom_point(size = 2) +
    geom_smooth(method = "lm", se = FALSE) +
    labs(title = "Petal length vs width by species") +
    theme_minimal()
  Use se = FALSE to suppress the grey confidence band when the plot is busy.

Faceted scatter + per-panel trend (mtcars-style):
  ggplot(mtcars, aes(x = wt, y = mpg)) +
    geom_point() +
    geom_smooth(method = "lm", se = FALSE) +
    facet_wrap(~ cyl) +
    labs(title = "MPG vs weight by cylinder count")
  facet_wrap(~ var) makes one panel per unique value of `var`. Use facet_grid(rows ~ cols) for a 2-D grid.

Histogram and boxplot in ggplot2:
  ggplot(df, aes(x = value)) + geom_histogram(bins = 30, fill = "steelblue", color = "white")
  ggplot(df, aes(x = group, y = value, fill = group)) + geom_boxplot()

Base R plotting (only when the question says "base R plot" or "plot()"):
  plot(mtcars$wt, mtcars$mpg, main = "...", xlab = "Weight", ylab = "MPG", pch = 19, col = "steelblue")
  hist(x, breaks = 30, col = "lightblue", main = "...")
  boxplot(mpg ~ cyl, data = mtcars, main = "...")

=== BASE R DATA-WRANGLING RECIPES (DEFAULT — use these on the exam) ===
These cover every dplyr operation you would normally reach for, using only
base R. No `library(dplyr)`, no `library(tidyverse)`. Safe under any imports
list because base R is always loaded.

- Filter rows:        df_sub  <- df[df$col == value, ]
                      df_sub  <- df[df$col &gt; k &amp; df$other == "x", ]
                      df_sub  <- subset(df, col &gt; k)         # subset() is also base R
- Add a new column:   df$new  <- ifelse(df$score &gt;= 50, "P", "F")
- Drop a column:      df$col  <- NULL
- Select columns:     df_sub  <- df[, c("a", "b", "c")]
- Sort:               df[order(df$col), ]                    # ascending
                      df[order(df$col, decreasing = TRUE), ] # descending
                      df[order(-df$col), ]                   # also descending
- Group means:        aggregate(Petal.Length ~ Species, data = iris, FUN = mean)
                      # multi-stat:
                      aggregate(cbind(Petal.Length, Sepal.Length) ~ Species,
                                data = iris, FUN = mean)
- Tabulate counts:    table(iris$Species)
- Apply across rows / cols of a matrix:
                      apply(m, 1, sum)   # row sums
                      apply(m, 2, mean)  # column means

For dates without lubridate:
- Parse:   d &lt;- as.Date("2026-06-15")
- Sequence (30 daily dates): seq(as.Date("2026-06-01"), by = "day", length.out = 30)
- Format: format(d, "%b %d") -&gt; "Jun 15"

=== dplyr RECIPES (ONLY when the question explicitly names dplyr, the pipe, or the tidyverse) ===
Always library(dplyr) before using filter/mutate/group_by. Never library(tidyverse) — see anti-patterns.

DATA FRAME context (column has a name in a df):
- Filter:    df |&gt; filter(age &gt; 25, dept == "DS")
- Mutate:    df |&gt; mutate(bmi = weight / (height/100)^2)
- Select:    df |&gt; select(name, age, dept)
- Arrange:   df |&gt; arrange(desc(score))
- Group + summarise — ALWAYS close with .groups = "drop" or you get a silent grouping warning:
    df |&gt;
      group_by(species) |&gt;
      summarise(mean_pl = mean(Petal.Length, na.rm = TRUE), .groups = "drop") |&gt;
      arrange(desc(mean_pl))
- case_when INSIDE a data frame (adding a new column):
    df |&gt; mutate(letter = case_when(
      score &gt;= 80 ~ "A",
      score &gt;= 65 ~ "B",
      score &gt;= 50 ~ "C",
      TRUE         ~ "F"
    ))

BARE VECTOR context (no data frame, just a 1D vector — e.g. FizzBuzz):
case_when() and ifelse() are STANDALONE FUNCTIONS. They take formulas
(LHS ~ RHS) directly as arguments. They are NOT pipe-targets and they do
NOT need mutate(). Assign the result to a name with &lt;-, then print it.

Vectorised FizzBuzz on a bare vector — copy this template verbatim:
    library(dplyr)
    x &lt;- 1:30
    result &lt;- case_when(
      x %% 15 == 0 ~ "FizzBuzz",
      x %% 3  == 0 ~ "Fizz",
      x %% 5  == 0 ~ "Buzz",
      TRUE         ~ as.character(x)
    )
    print(result)
NO pipe. NO mutate. NO `x |&gt; case_when(...)`. The vector lives inside each
formula's LHS, not on the left of |&gt;. Same shape works with ifelse:
    result &lt;- ifelse(x %% 15 == 0, "FizzBuzz",
              ifelse(x %% 3  == 0, "Fizz",
              ifelse(x %% 5  == 0, "Buzz", as.character(x))))

=== STATS RECIPES ===
- Correlation:        cor(x, y)   ;  cor(df[, c("a","b","c")])
- t-test:             t.test(x, mu = 50)   ;  t.test(x, y)
- Linear regression:  fit &lt;- lm(mpg ~ wt + hp, data = mtcars)
                      summary(fit)        # coefficients, R^2, p-values
                      predict(fit, newdata = ...)
- summary(df)         shows min/Q1/median/mean/Q3/max per numeric column

=== DATA I/O ===
- Read CSV:           df &lt;- read.csv("data.csv")
                      OR readr: df &lt;- readr::read_csv("data.csv")
- Write CSV:          write.csv(df, "out.csv", row.names = FALSE)
- RDS (R-only):       saveRDS(df, "data.rds")  ;  readRDS("data.rds")

=== ANTI-PATTERNS (never do these) ===
- Never write v[0] to access the first element. R is 1-indexed. The first element is v[1].
- Never use = for assignment in standalone statements. Use &lt;-. (= inside function arguments like na.rm = TRUE is fine.)
- Never compute mean / sd / median / quantile without na.rm = TRUE unless the question explicitly forbids it.
- Never use &amp;&amp; or || inside ifelse(), filter(), or on whole vectors. Use single &amp; / |.
- Never write a for-loop where a vectorised expression (ifelse, case_when, x * 2, x[x &gt; k]) does the same job. Vectorised FizzBuzz example:
    x &lt;- 1:30
    out &lt;- ifelse(x %% 15 == 0, "FizzBuzz",
           ifelse(x %% 3  == 0, "Fizz",
           ifelse(x %% 5  == 0, "Buzz", as.character(x))))
- Never reach for a Python idiom: no x.mean(), no len(x) (use length(x)), no range(n) (use 1:n or 0:(n-1)), no df.head() (use head(df)), no import (use library()), no def (use function()).
- Never write a ggplot answer that omits library(ggplot2) at the top. Same for library(dplyr) when piping with dplyr verbs.
- Never write data = df instead of data = df inside ggplot() AND data = df with quoted names — column names inside aes() are UNQUOTED bare symbols (aes(x = wt, y = mpg)), never aes(x = "wt", y = "mpg").
- Never use + on the LAST line of a multi-line ggplot chain. The + has to be at the END of the previous line so R knows the expression continues.
- Never wrap the answer in prose like "Here is the solution". Start at "Assumptions:".
- Never close a group_by() pipeline with a summarise() that omits .groups = "drop" — the result stays grouped and silently breaks the next step.
- Never call install.packages() in the code block. The user already has the package. Use library() only.
- Never call library(tidyverse). Always library() the SPECIFIC packages you use: library(ggplot2), library(dplyr), library(lubridate), library(tidyr), library(readr). Bulk-importing tidyverse hides dependencies, slows startup, and silently fails when only part of tidyverse is installed.
- Never call library(base). Base R is loaded automatically — typing library(base) is a no-op that signals the answer was written by someone who does not know R.
- Never wrap a standalone vector operation in mutate(). mutate() works on data frame COLUMNS, never on bare vectors. For a vector `x`, write `result <- case_when(x %% 15 == 0 ~ "FizzBuzz", ...)` directly. Do NOT write `x |> mutate(result = case_when(...))` — that errors because `x` is not a data frame. The same rule applies to summarise(), select(), filter(), arrange() — pipe a data frame into them, never a bare vector.
- Never pipe a bare vector into case_when() either. case_when() takes formulas (LHS ~ RHS) as its arguments — it is NOT a pipe target. `x |> case_when(...)` errors with "Case 1 (`x`) must be a two-sided formula, not an integer vector." The right call is `result <- case_when(x %% 15 == 0 ~ "FizzBuzz", x %% 3 == 0 ~ "Fizz", ...)` with NO pipe and NO mutate. The vector belongs INSIDE each formula's LHS.
- Never write defensive `if (!exists("mtcars"))` / `if (!exists("iris"))` fallbacks for built-in datasets. mtcars, iris, airquality, etc. are part of the `datasets` package which is attached at R startup. They are always available. Defensive fallbacks are noise.
- Never produce more than one Assumptions / code / Notes triple per question. After the first Notes block you are DONE. Do not write a second code block. Do not "improve" your own answer. Do not say "Alternatively" or "Another way". The very first triple is the final answer.

<script>
window.onerror = function(msg, src, line) {

const BASE = () => ``;

// ─── State ───────────────────────────────────────────────────────────────────
let history = [];
let attachedFiles = [];
let isGenerating = false;
let abortCtrl = null;

function makeTitle() {
  const first = history.find(m => m.role === 'user');
  if (!first) return 'Empty chat';
  return first.content.replace(/\[File:[^\]]+\]/g, '').trim().slice(0, 60) || 'Chat';
}

async function saveSession() {
  if (history.length === 0) return;
  const session = {
    id: currentSessionId,
    title: makeTitle(),
    date: new Date().toLocaleString(),
    messages: history,
  };
  try {
    await fetch('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(session),
    });
  } catch {}
}

async function loadSessionIntoChat(session) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();
  document.getElementById('chat').innerHTML = '';
  history = session.messages;
  currentSessionId = session.id;
  for (const msg of history) {
    const div = appendMessage(msg.role, msg.content, null, msg.reasoning);
    if (msg.role === 'assistant' && div) {
      const actions = div.querySelector('.msg-actions');
      if (actions) {
        const answerText = msg.reasoning ? msg.content : (parseThinking(msg.content).main || msg.content);
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.onclick = () => copyText(answerText, btn);
        actions.appendChild(btn);
      }
    }
  }
  scrollToBottom();
  closeHistory();
}

// ─── Init ────────────────────────────────────────────────────────────────────
function init() {
  autoResize(document.getElementById('msg-input'));
  checkConnection();
  setInterval(checkConnection, 8000);
  setupFileInput();

// ─── Connection check ────────────────────────────────────────────────────────
async function checkConnection() {
  const dot = document.getElementById('status-dot');
  const lbl = document.getElementById('status-label');
  const hint = document.getElementById('hint-model');

  // Skip polling during generation — server is busy with the chat request,
  // and receiving stream chunks is already proof the connection is alive.
  if (isGenerating) return;

  // Only show the yellow "Connecting" state on the very first check,
  // or when transitioning from disconnected. Once connected, poll silently.
  const wasConnected = dot.classList.contains('ok');
  if (!wasConnected) {
    dot.className = 'checking';
    lbl.textContent = 'Connecting';
  }

  try {
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), 5000);
    const r = await fetch(BASE() + '/v1/models', { signal: ac.signal });
    clearTimeout(t);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const name = (data.data && data.data[0]) ? data.data[0].id : 'local';
    const shortName = name.split('/').pop().replace(/-GGUF$/i, '');
    if (!wasConnected) {
      dot.className = 'ok';
      lbl.textContent = 'Connected';
    }
    hint.textContent = shortName;
  } catch(e) {
    dot.className = '';
    lbl.textContent = 'Disconnected';
    hint.textContent = 'no model loaded';
  }
}

// ─── File attachment ─────────────────────────────────────────────────────────
function setupFileInput() {
  document.getElementById('file-input').addEventListener('change', e => {
    readFiles(Array.from(e.target.files));
    e.target.value = '';
  });
}

function setupDragDrop() {
  const overlay = document.getElementById('drop-overlay');
  let dragCounter = 0;

  document.addEventListener('dragenter', e => {
    if (e.dataTransfer.types.includes('Files')) {
      dragCounter++;
      overlay.classList.add('active');
    }
  });
  document.addEventListener('dragleave', () => {
    dragCounter--;
    if (dragCounter <= 0) { dragCounter = 0; overlay.classList.remove('active'); }
  });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    dragCounter = 0;
    overlay.classList.remove('active');
    if (e.dataTransfer.files.length > 0) {
      readFiles(Array.from(e.dataTransfer.files));
    }
  });
}

function readFiles(files) {
  files.forEach(file => {
    if (attachedFiles.find(f => f.name === file.name)) return;
    const reader = new FileReader();
    reader.onload = e => {
      attachedFiles.push({ name: file.name, content: e.target.result });
      renderFileChips();
    };
    reader.readAsText(file);
  });
}

function renderFileChips() {
  const container = document.getElementById('attached-files');
  container.innerHTML = '';
  attachedFiles.forEach((f, i) => {
    const chip = document.createElement('div');
    chip.className = 'file-chip';
    chip.innerHTML = `
      <svg class="icon icon-sm"><use href="#icon-file"/></svg>
      <span class="chip-name">${escHtml(f.name)}</span>
      <span class="remove" onclick="removeFile(${i})" title="Remove">
        <svg class="icon icon-sm"><use href="#icon-x"/></svg>
      </span>`;
    container.appendChild(chip);
  });
}

function removeFile(i) {
  attachedFiles.splice(i, 1);
  renderFileChips();
}

// ─── Send message ────────────────────────────────────────────────────────────
function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || isGenerating) return;

  const dot = document.getElementById('status-dot');
  if (!dot.classList.contains('ok')) {
    showError('Server not connected. Run: python start_r.py');
    return;
  }

  const welcome = document.getElementById('welcome');
  if (welcome && welcome.parentNode) welcome.remove();

  const fileNames = attachedFiles.map(f => f.name);

  let fullContent = '';
  if (attachedFiles.length > 0) {
    attachedFiles.forEach(f => {
      fullContent += `[File: ${f.name}]\n${f.content}\n[/File]\n\n`;
    });
    attachedFiles = [];
    renderFileChips();
  }
  fullContent += text;

  history.push({ role: 'user', content: fullContent });
  appendMessage('user', text, fileNames);

  input.value = '';
  resizeInput();

  streamResponse();
}

// ─── Stream response ─────────────────────────────────────────────────────────
async function streamResponse() {
  isGenerating = true;
  document.getElementById('send-btn').disabled = true;

  const aiDiv = appendMessage('ai', null);
  const bodyEl = aiDiv.querySelector('.msg-body');
  const thinkEl = aiDiv.querySelector('.think-block');
  const thinkBodyEl = aiDiv.querySelector('.think-body');
  bodyEl.innerHTML = '<div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';

  abortCtrl = new AbortController();
  let contentRaw = '';
  let reasoningRaw = '';

  const cleanHistory = history.map(m => ({ role: m.role, content: m.content }));
  const messages = cfg.sysPrompt
    ? [{ role: 'system', content: cfg.sysPrompt }, ...cleanHistory]
    : cleanHistory;

  try {
    const res = await fetch(BASE() + '/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: abortCtrl.signal,
      body: JSON.stringify({
        model: 'local',
        messages,
        stream: true,
        temperature: cfg.temp,
        max_tokens: cfg.maxTokens,
      }),
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error(`HTTP ${res.status}: ${err}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const j = JSON.parse(data);
          const delta = j.choices?.[0]?.delta;
          if (!delta) continue;

          // Reasoning tokens arrive in a separate field (llama.cpp build 8914+)
          if (delta.reasoning_content) {
            reasoningRaw += delta.reasoning_content;
            if (thinkEl.style.display === 'none') {
              thinkEl.style.display = '';
              thinkEl.open = false;  // start collapsed; user clicks to peek
              thinkEl.classList.add('streaming');
            }
            thinkBodyEl.textContent = reasoningRaw;
          }

          // Answer tokens
          if (delta.content) {
            // First answer token — reasoning is complete, collapse it
            if (!contentRaw && reasoningRaw) {
              thinkEl.classList.remove('streaming');
              thinkEl.open = false;
            }
            contentRaw += delta.content;

            // Fallback: some templates still emit inline <think> tags in content
            const parsed = parseThinking(contentRaw);
            if (parsed.think && !reasoningRaw) {
              if (thinkEl.style.display === 'none') {
                thinkEl.style.display = '';
              }
              thinkBodyEl.textContent = parsed.think;
              if (parsed.closed) {
                thinkEl.classList.remove('streaming');
                thinkEl.open = false;
              }
            }
            const answerText = (reasoningRaw || !parsed.think) ? contentRaw : parsed.main;
            if (answerText) {
              bodyEl.innerHTML = renderMarkdown(answerText);
            }
            scrollToBottom();
          }
        } catch {}
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      bodyEl.innerHTML = `<span style="color:var(--red)">Error: ${escHtml(e.message)}</span>`;
    }
  }

  thinkEl.classList.remove('streaming');

  // Resolve final answer: prefer pure content; fall back to stripping inline <think>
  let finalAnswer = contentRaw;
  if (!reasoningRaw && contentRaw) {
    const parsed = parseThinking(contentRaw);
    if (parsed.think) {
      reasoningRaw = parsed.think;
      finalAnswer = parsed.main;
    }
  }
  if (!finalAnswer) finalAnswer = '[no response]';

  history.push({ role: 'assistant', content: finalAnswer, reasoning: reasoningRaw });
  saveSession();

  const actions = aiDiv.querySelector('.msg-actions');
  const btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.textContent = 'Copy';
  btn.onclick = () => copyText(finalAnswer, btn);
  actions.appendChild(btn);

  scrollToBottom();
  isGenerating = false;
  abortCtrl = null;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('msg-input').focus();
}

// ─── Append message ──────────────────────────────────────────────────────────
function appendMessage(role, text, fileNames, reasoning) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'You' : 'AI';
  div.appendChild(label);

  if (fileNames && fileNames.length > 0) {
    fileNames.forEach(name => {
      const chip = document.createElement('div');
      chip.className = 'file-chip';
      chip.style.marginBottom = '4px';
      chip.innerHTML = `<svg class="icon icon-sm"><use href="#icon-file"/></svg><span class="chip-name">${escHtml(name)}</span>`;
      div.appendChild(chip);
    });
  }

  // Thinking block placeholder (AI only) — hidden until reasoning arrives
  if (role === 'ai') {
    const think = document.createElement('details');
    think.className = 'think-block';
    think.style.display = 'none';
    think.innerHTML = '<summary>Reasoning</summary><div class="think-body"></div>';
    div.appendChild(think);
  }

  const body = document.createElement('div');
  body.className = 'msg-body';
  if (text !== null) {
    if (role === 'ai') {
      // Prefer explicit reasoning arg (new format); fall back to parsing <think> tags (legacy)
      let answerText = text;
      let reasoningText = reasoning || '';
      if (!reasoningText) {
        const parsed = parseThinking(text);
        if (parsed.think) {
          reasoningText = parsed.think;
          answerText = parsed.main || text;
        }
      }
      if (reasoningText) {
        const thinkEl = div.querySelector('.think-block');
        thinkEl.style.display = '';
        thinkEl.querySelector('.think-body').textContent = reasoningText;
      }
      body.innerHTML = renderMarkdown(answerText);
    } else {
      body.innerHTML = renderMarkdown(text);
    }
  }
  div.appendChild(body);

  const actions = document.createElement('div');
  actions.className = 'msg-actions';
  if (role === 'user' && text) {
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copy';
    btn.onclick = () => copyText(text, btn);
    actions.appendChild(btn);
  }
  div.appendChild(actions);

  chat.appendChild(div);
  scrollToBottom(true);
  return div;
}

function showError(msg) {
  const chat = document.getElementById('chat');
  const welcome = document.getElementById('welcome');
  if (welcome && welcome.parentNode) welcome.remove();
  const div = document.createElement('div');
  div.style.cssText = 'color:var(--red);text-align:center;padding:16px;font-size:12.5px;';
  div.textContent = msg;
  chat.appendChild(div);
  scrollToBottom();
}

// ─── Auto-resize textarea ────────────────────────────────────────────────────
function resizeInput() {
  const el = document.getElementById('msg-input');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

function autoResize(el) {
  el.addEventListener('input', resizeInput);
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  resizeInput(); // collapse to single line on startup
}

function scrollToBottom(force) {
  const chat = document.getElementById('chat');
  // Only auto-scroll if user is already near the bottom, unless forced.
  // "Near" = within 120px of the bottom.
  const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120;
  if (!force && !nearBottom) return;
  // Wait for the next frame so layout has finished after the DOM update.
  requestAnimationFrame(() => {
    chat.scrollTop = chat.scrollHeight;
  });
}

// ─── Copy helper ─────────────────────────────────────────────────────────────
function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
  });
}

// ─── HTML escape ─────────────────────────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
           .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ─── Thinking-block parser (Qwen3 <think>…</think>) ──────────────────────────
function parseThinking(text) {
  const openIdx = text.indexOf('<think>');
  if (openIdx === -1) return { think: '', main: text, closed: true };
  const afterOpen = openIdx + 7;
  const closeIdx = text.indexOf('</think>', afterOpen);
  if (closeIdx === -1) {
    return {
      think: text.slice(afterOpen),
      main: text.slice(0, openIdx),
      closed: false,
    };
  }
  const before = text.slice(0, openIdx);
  const content = text.slice(afterOpen, closeIdx);
  const after = text.slice(closeIdx + 8);
  return {
    think: content,
    main: (before + after).replace(/^\s+/, ''),
    closed: true,
  };
}

// ─── Markdown renderer ───────────────────────────────────────────────────────
function renderMarkdown(raw) {
  let out = '';
  const parts = raw.split(/(```[\w]*\n[\s\S]*?```|```[\w]*[\s\S]*?```)/g);

  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      const langMatch = part.match(/^```([\w]*)\n?/);
      const lang = langMatch ? langMatch[1].toLowerCase() : '';
      const code = part.replace(/^```[\w]*\n?/, '').replace(/```$/, '');
      out += renderCodeBlock(code, lang);
    } else {
      out += renderInline(part);
    }
  });

  return out;
}

function renderCodeBlock(code, lang) {
  const esc = escHtml(code);
  const highlighted = highlight(esc, lang);
  const langLabel = lang || 'code';
  const id = 'cb' + Math.random().toString(36).slice(2);
  return `<div class="code-block">
  <div class="code-header">
    <span class="code-lang">${escHtml(langLabel)}</span>
    <button class="code-copy" id="${id}" onclick="copyCode('${id}', ${JSON.stringify(code)})">Copy</button>
  </div>
  <pre><code class="block-code">${highlighted}</code></pre>
</div>`;
}

function copyCode(id, code) {
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.getElementById(id);
    if (btn) {
      btn.textContent = 'Copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
    }
  });
}

function renderInline(text) {
  if (!text) return '';

  let s = escHtml(text);

  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  s = s.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');

  s = s.replace(/^---+$/gm, '<hr style="border-color:var(--border2);margin:8px 0">');

  s = s.replace(/^[ \t]*[-*] (.+)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
  s = s.replace(/<\/ul>\s*<ul>/g, '');

  s = s.replace(/^\d+\. (.+)$/gm, '<oli>$1</oli>');
  s = s.replace(/(<oli>[\s\S]*?<\/oli>)/g, '<ol>$1</ol>');
  s = s.replace(/<\/ol>\s*<ol>/g, '');
  s = s.replace(/<oli>/g, '<li>').replace(/<\/oli>/g, '</li>');

  s = s.replace(/\n\n+/g, '</p><p>');
  s = s.replace(/\n/g, '<br>');
  s = '<p>' + s + '</p>';

  s = s.replace(/<p><\/p>/g, '');
  s = s.replace(/<p>(<h[1-3]>)/g, '$1');
  s = s.replace(/(<\/h[1-3]>)<\/p>/g, '$1');
  s = s.replace(/<p>(<ul>)/g, '$1');
  s = s.replace(/(<\/ul>)<\/p>/g, '$1');
  s = s.replace(/<p>(<ol>)/g, '$1');
  s = s.replace(/(<\/ol>)<\/p>/g, '$1');
  s = s.replace(/<p>(<hr)/g, '$1');
  s = s.replace(/(>)<\/p>/g, '>');

  return s;
}

// ─── Syntax highlighter ──────────────────────────────────────────────────────
function highlight(s, lang) {
  if (lang === 'python' || lang === 'py') {
    const keywords = ['def','class','return','import','from','as','if','elif','else',
      'for','while','in','not','and','or','is','None','True','False','pass','break',
      'continue','try','except','finally','raise','with','lambda','yield','global',
      'nonlocal','del','assert','async','await'];
    const builtins = ['print','range','len','list','dict','set','tuple','str','int',
      'float','bool','type','isinstance','enumerate','zip','map','filter','sorted',
      'reversed','sum','min','max','abs','round','open','input','super','property',
      'staticmethod','classmethod','getattr','setattr','hasattr','vars','dir','repr',
      'format','isinstance','issubclass','callable','iter','next','any','all'];

    s = s.replace(/((?:&quot;|&#39;)(?:[^&]|&(?!quot;|#39;))*?(?:&quot;|&#39;))/g,
      '<span class="st">$1</span>');
    s = s.replace(/((&quot;){3}[\s\S]*?(&quot;){3})/g, '<span class="st">$1</span>');

    s = s.replace(/(#[^\n]*)/g, '<span class="co">$1</span>');

    s = s.replace(/(@\w+)/g, '<span class="de">$1</span>');

    const kwRe = new RegExp(`\\b(${keywords.join('|')})\\b`, 'g');
    s = s.replace(kwRe, '<span class="kw">$1</span>');

    const biRe = new RegExp(`\\b(${builtins.join('|')})\\b`, 'g');
    s = s.replace(biRe, '<span class="bi">$1</span>');

    s = s.replace(/\b(\d+\.?\d*(?:[eE][+-]?\d+)?)\b/g, '<span class="nu">$1</span>');

  } else if (lang === 'js' || lang === 'javascript' || lang === 'ts' || lang === 'typescript') {
    const keywords = ['const','let','var','function','return','if','else','for','while',
      'class','import','export','default','from','new','this','typeof','instanceof',
      'null','undefined','true','false','async','await','try','catch','finally','throw',
      'of','in','extends','super','static','=>'];
    s = s.replace(/((?:&quot;|&#39;|`)(?:[^&`]|&(?!quot;|#39;))*?(?:&quot;|&#39;|`))/g,
      '<span class="st">$1</span>');
    s = s.replace(/(\/\/[^\n]*)/g, '<span class="co">$1</span>');
    s = s.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="co">$1</span>');
    const kwRe = new RegExp(`\\b(${keywords.join('|')})\\b`, 'g');
    s = s.replace(kwRe, '<span class="kw">$1</span>');
    s = s.replace(/\b(\d+\.?\d*)\b/g, '<span class="nu">$1</span>');

  } else {
    s = s.replace(/(\/\/[^\n]*)/g, '<span class="co">$1</span>');
    s = s.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="co">$1</span>');
    s = s.replace(/((?:&quot;|&#39;)(?:[^&]|&(?!quot;|#39;))*?(?:&quot;|&#39;))/g,
      '<span class="st">$1</span>');
    s = s.replace(/\b(\d+\.?\d*)\b/g, '<span class="nu">$1</span>');
  }

  return s;
}

// ─── History panel ───────────────────────────────────────────────────────────
async function openHistory() {
  document.getElementById('history-overlay').classList.add('open');
  document.getElementById('history-panel').classList.add('open');
  await renderHistoryList();
}

function closeHistory() {
  document.getElementById('history-overlay').classList.remove('open');
  document.getElementById('history-panel').classList.remove('open');
}

async function renderHistoryList() {
  const list = document.getElementById('history-list');
  list.innerHTML = '<div id="history-empty">Loading</div>';
  let sessions = [];
  try {
    const r = await fetch('/api/sessions');
    sessions = await r.json();
  } catch {
    list.innerHTML = '<div id="history-empty">Could not load history.</div>';
    return;
  }
  if (!sessions || sessions.length === 0) {
    list.innerHTML = '<div id="history-empty">No saved chats yet.<br>Start a conversation and it will appear here.</div>';
    return;
  }
  list.innerHTML = '';
  sessions.forEach(s => {
    const div = document.createElement('div');
    div.className = 'session-item';
    div.innerHTML = `
      <div class="session-title">${escHtml(s.title)}</div>
      <div class="session-meta">${escHtml(s.date)} &middot; ${s.messages.length} messages</div>
      <button class="session-del" title="Delete" onclick="deleteSession(event,'${escHtml(s.id)}')">
        <svg class="icon icon-sm"><use href="#icon-x"/></svg>
      </button>`;
    div.addEventListener('click', () => loadSessionIntoChat(s));
    list.appendChild(div);
  });
}

async function deleteSession(e, id) {
  e.stopPropagation();
  try { await fetch(`/api/sessions/${id}`, { method: 'DELETE' }); } catch {}
  await renderHistoryList();
}

// ─── Start ───────────────────────────────────────────────────────────────────
init();
</script>
